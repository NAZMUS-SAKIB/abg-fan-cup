services:
  db:
    image: postgres:16-alpine
    container_name: abg-fan-cup-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: abg_fan_cup
    ports:
      - "5432:5432"
    volumes:
      - abg_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d abg_fan_cup"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  abg_pg_data:

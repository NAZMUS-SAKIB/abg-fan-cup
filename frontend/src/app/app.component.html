<header class="topnav">
  <a routerLink="/" class="brand-wrap">
    <img src="assets/abg-logo.png" alt="ABG" class="nav-logo" />
    <span class="brand-title">ABG University Cup 2026</span>
  </a>
  <div class="nav-actions">
    <ng-container *ngIf="adminLoggedIn; else adminLoginLink">
      <a routerLink="/admin" class="admin-link">Admin</a>
      <button type="button" class="admin-link logout-link" (click)="logoutAdmin()">Logout</button>
    </ng-container>
    <ng-template #adminLoginLink>
      <a routerLink="/admin" class="admin-link">Admin Login</a>
    </ng-template>

    <div class="settings" (click)="$event.stopPropagation()">
      <button
        type="button"
        class="gear-btn"
        (click)="toggleSettings()"
        [attr.aria-expanded]="settingsOpen"
        aria-haspopup="true"
        aria-label="Open settings"
      >
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <path
            fill="currentColor"
            d="M19.14 12.94c.04-.31.06-.63.06-.94s-.02-.63-.06-.94l2.03-1.58a.5.5 0 0 0 .12-.64l-1.92-3.32a.5.5 0 0 0-.6-.22l-2.39.96a7.03 7.03 0 0 0-1.63-.94l-.36-2.54A.5.5 0 0 0 13.9 2h-3.8a.5.5 0 0 0-.49.42l-.36 2.54c-.58.23-1.12.54-1.63.94l-2.39-.96a.5.5 0 0 0-.6.22L2.71 8.84a.5.5 0 0 0 .12.64l2.03 1.58c-.04.31-.06.63-.06.94s.02.63.06.94l-2.03 1.58a.5.5 0 0 0-.12.64l1.92 3.32c.14.24.43.34.68.22l2.39-.96c.5.4 1.05.71 1.63.94l.36 2.54c.05.24.25.42.49.42h3.8c.24 0 .44-.18.49-.42l.36-2.54c.58-.23 1.12-.54 1.63-.94l2.39.96c.25.1.54 0 .68-.22l1.92-3.32a.5.5 0 0 0-.12-.64l-2.03-1.58ZM12 15.5A3.5 3.5 0 1 1 12 8.5a3.5 3.5 0 0 1 0 7Z"
          />
        </svg>
      </button>

      <div class="settings-panel" *ngIf="settingsOpen" role="menu">
        <div class="settings-section">
          <div class="settings-label">Mode / Theme</div>
          <div class="theme-choices">
            <button
              type="button"
              class="theme-choice"
              [class.active]="themeMode === 'night'"
              (click)="setTheme('night')"
            >
              Night
            </button>
            <button
              type="button"
              class="theme-choice"
              [class.active]="themeMode === 'day'"
              (click)="setTheme('day')"
            >
              Day
            </button>
          </div>
        </div>

        <div class="settings-section">
          <div class="settings-label">Motion</div>
          <div class="theme-choices">
            <button
              type="button"
              class="theme-choice"
              [class.active]="motionMode === 'full'"
              (click)="setMotion('full')"
            >
              Full
            </button>
            <button
              type="button"
              class="theme-choice"
              [class.active]="motionMode === 'reduce'"
              (click)="setMotion('reduce')"
            >
              Reduce
            </button>
          </div>
        </div>

        <div class="settings-section">
          <div class="settings-label">Density</div>
          <div class="theme-choices">
            <button
              type="button"
              class="theme-choice"
              [class.active]="densityMode === 'comfortable'"
              (click)="setDensity('comfortable')"
            >
              Comfort
            </button>
            <button
              type="button"
              class="theme-choice"
              [class.active]="densityMode === 'compact'"
              (click)="setDensity('compact')"
            >
              Compact
            </button>
          </div>
        </div>

        <div class="settings-section" *ngIf="adminLoggedIn">
          <div class="settings-label">Magic email link</div>
          <div class="magic-toggle-row">
            <span class="magic-toggle-text">{{ magicLinkRequired ? 'On' : 'Off' }}</span>
            <button
              type="button"
              class="magic-toggle"
              role="switch"
              [attr.aria-checked]="magicLinkRequired"
              [class.on]="magicLinkRequired"
              [disabled]="magicToggleBusy"
              (click)="toggleMagicLink()"
              aria-label="Toggle magic email link verification"
            >
              <span class="magic-toggle-knob"></span>
            </button>
          </div>
          <p class="settings-hint">
            {{ magicLinkRequired ? 'Voters must verify with email magic link' : 'Open voting with captcha only' }}
          </p>
          <p class="settings-error" *ngIf="magicToggleError">{{ magicToggleError }}</p>
        </div>
      </div>
    </div>
  </div>
</header>
<main>
  <router-outlet />
</main>
<app-site-footer [showDevCredit]="showDevCredit" />
